[project]
name = "plumbline-mcp"
version = "0.1.0.dev0"
description = "Search Dubai, Spain, Colombia and Florida tenancy law, read the cited article and check a lease clause, from any MCP client."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Daniel M.C." }]
keywords = ["mcp", "model-context-protocol", "legal", "tenancy", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=2.3,<3", "httpx>=0.28", "pydantic>=2.14"]

[project.scripts]
plumbline-mcp = "plumbline_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
