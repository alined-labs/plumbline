<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>EmptyState</title>
</head>
<body>
<div class="al-pad">
  <div class="al-empty">
    <h1 class="al-empty__title">What do you want to know about your lease?</h1>
    <p class="al-empty__body">Plumbline answers from the tenancy statutes of Dubai, Spain, Colombia and Florida, and cites the passage behind every claim.</p>
    <div class="al-examples">
      <button class="al-example"><span class="al-badge al-badge--code">AE-DU</span>How much notice does my landlord need to evict me when the lease ends?</button>
      <button class="al-example"><span class="al-badge al-badge--code">ES</span>What is the minimum length of a residential lease in Spain?</button>
      <button class="al-example"><span class="al-badge al-badge--code">CO</span>How much can my landlord in Bogotá raise the rent each year?</button>
      <button class="al-example"><span class="al-badge al-badge--code">US-FL</span>How long does my landlord have to return my deposit?</button>
    </div>
  </div>
</div>
</body>
</html>
