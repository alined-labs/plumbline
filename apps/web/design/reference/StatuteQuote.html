<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>StatuteQuote</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:680px">
  <figure class="al-quote" style="margin:0">
    <figcaption class="al-quote__ref"><span class="al-badge al-badge--code">CO</span><strong>Ley 820 de 2003, art. 20</strong><span>Consolidated text</span><span class="al-verified"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></svg>Verified</span></figcaption>
    Cada doce (12) meses de ejecución del contrato bajo un mismo precio, <mark class="al-mark is-active">el arrendador podrá incrementar el canon hasta en una proporción que no sea superior al ciento por ciento (100%) del incremento que haya tenido el índice de precios al consumidor en el año calendario inmediatamente anterior</mark> a aquel en que deba efectuarse el reajuste del canon.
  </figure>
  <figure class="al-quote al-quote--sm" style="margin:0">
    <figcaption class="al-quote__ref"><span class="al-badge al-badge--code">ES</span><strong>Ley 29/1994, art. 6</strong><span>Consolidated text</span><span class="al-verified"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></svg>Verified</span></figcaption>
    <mark class="al-mark">Son nulas, y se tendrán por no puestas, las estipulaciones que modifiquen en perjuicio del arrendatario</mark> o subarrendatario las normas del presente Título, salvo los casos en que la propia norma expresamente lo autorice.
  </figure>
</div>
</body>
</html>
