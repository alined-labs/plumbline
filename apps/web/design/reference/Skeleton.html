<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>Skeleton</title>
</head>
<body>
<div class="al-pad" style="max-width:640px">
  <div class="al-stack" aria-busy="true" aria-label="Loading the answer">
    <div class="al-answer__meta"><span class="al-spinner"></span>Searching 4 jurisdictions</div>
    <div><span class="al-skel al-skel--line al-skel--shimmer" style="width:96%"></span><span class="al-skel al-skel--line al-skel--shimmer" style="width:88%"></span><span class="al-skel al-skel--line al-skel--shimmer" style="width:54%"></span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <span class="al-skel al-skel--shimmer" style="height:96px;border-radius:var(--radius-lg)"></span>
      <span class="al-skel al-skel--shimmer" style="height:96px;border-radius:var(--radius-lg)"></span>
    </div>
  </div>
</div>
</body>
</html>
