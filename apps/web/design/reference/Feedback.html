<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>Feedback</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:640px">
  <div class="al-answer__actions"><button class="al-btn al-btn--ghost al-btn--icon al-btn--sm" aria-label="Copy answer"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button><button class="al-btn al-btn--ghost al-btn--icon al-btn--sm" aria-label="Helpful"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/> <path d="M7 10v12"/></svg></button><button class="al-btn al-btn--ghost al-btn--icon al-btn--sm" aria-label="Not helpful" aria-pressed="true" style="background:var(--bg-active);color:var(--fg)"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/> <path d="M17 14V2"/></svg></button></div>
  <div class="al-feedback" style="padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)">
    <span class="ui-strong">What went wrong?</span>
    <div class="al-feedback__reasons"><button class="al-chip" aria-pressed="true">Wrong citation</button><button class="al-chip" aria-pressed="false">Missed a statute</button><button class="al-chip" aria-pressed="false">Outdated law</button><button class="al-chip" aria-pressed="false">Hard to follow</button><button class="al-chip" aria-pressed="false">Something else</button></div>
    <label class="al-sr" for="note">Note</label><input class="al-input" id="note" placeholder="Anything else? (optional)">
    <div class="al-row" style="justify-content:flex-end"><button class="al-btn al-btn--ghost al-btn--sm">Cancel</button><button class="al-btn al-btn--primary al-btn--sm">Send</button></div>
  </div>
</div>
</body>
</html>
