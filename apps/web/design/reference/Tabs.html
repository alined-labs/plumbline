<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>Tabs</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:640px">
  <div class="al-tabs" role="tablist"><button class="al-tab" role="tab" aria-selected="true">Findings <span class="al-count">11</span></button><button class="al-tab" role="tab" aria-selected="false">Lease text</button><button class="al-tab" role="tab" aria-selected="false">Trace</button></div>
  <div class="al-row" style="gap:8px"><button class="al-chip" aria-pressed="true">All</button><button class="al-chip" aria-pressed="false">Dubai <span class="al-badge al-badge--code">AE-DU</span></button><button class="al-chip" aria-pressed="false">Spain <span class="al-badge al-badge--code">ES</span></button><button class="al-chip" aria-pressed="false">Colombia <span class="al-badge al-badge--code">CO</span></button><button class="al-chip" aria-pressed="false">Florida <span class="al-badge al-badge--code">US-FL</span></button></div>
</div>
</body>
</html>
