<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>Dropzone</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:640px">
  <button class="al-drop" type="button" style="width:100%;font:inherit;color:inherit;cursor:pointer">
    <span style="color:var(--fg-muted)"><svg class="al-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/> <path d="m17 8-5-5-5 5"/> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg></span>
    <span class="al-drop__title">Drop a lease here or choose a file</span>
    <span class="al-drop__help">PDF or DOCX, up to 20 MB. Names, IDs and addresses are removed before any model reads it.</span>
  </button>
  <div class="al-file">
    <span class="al-file__icon"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/> <path d="M14 2v5a1 1 0 0 0 1 1h5"/> <path d="M10 9H8"/> <path d="M16 13H8"/> <path d="M16 17H8"/></svg></span>
    <span class="al-file__name">contrato-arrendamiento-chapinero.pdf</span>
    <span class="small al-muted al-num">1.4 MB</span>
    <div class="al-file__stages">
      <span class="is-done"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Uploaded</span>
      <span class="is-done"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Redacted 9 details</span>
      <span class="is-active"><span class="al-spinner"></span>Reading 6 of 11 pages</span>
      <span>Checking clauses</span>
    </div>
    <div class="al-progress" role="progressbar" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100" aria-label="Reading the lease"><span style="width:55%"></span></div>
  </div>
</div>
</body>
</html>
