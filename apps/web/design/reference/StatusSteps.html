<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>StatusSteps</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:560px">
  <ol class="al-steps" aria-live="polite">
    <li class="al-step al-step--done"><span class="al-step__icon"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></svg></span><span>Reading your question</span><span class="al-step__time">0.2 s</span></li>
    <li class="al-step al-step--done"><span class="al-step__icon"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></svg></span><span>Searching 4 jurisdictions <span class="al-step__detail">· 40 passages</span></span><span class="al-step__time">0.9 s</span></li>
    <li class="al-step al-step--done"><span class="al-step__icon"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></svg></span><span>Ranking passages <span class="al-step__detail">· kept 8</span></span><span class="al-step__time">0.6 s</span></li>
    <li class="al-step al-step--active"><span class="al-step__icon"><span class="al-spinner"></span></span><span>Checking citations <span class="al-step__detail">· 3 of 4 verified</span></span><span class="al-step__time">1.1 s</span></li>
    <li class="al-step al-step--pending"><span class="al-step__icon"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg></span><span>Writing the answer</span><span class="al-step__time"></span></li>
  </ol>
  <div class="al-working"><span class="al-spinner"></span><span class="al-working__label">Checking citations</span><span class="al-step__time">0:04</span><button class="al-btn al-btn--secondary al-btn--sm"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>Stop <span class="al-kbd">Esc</span></button></div>
</div>
</body>
</html>
