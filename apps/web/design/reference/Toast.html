<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>Toast</title>
</head>
<body>
<div class="al-pad al-stack" style="align-items:flex-start">
  <div class="al-toast" role="status"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m16 9-5.5 5.5L8 12"/></svg><span class="al-toast__label">Reference copied: Fla. Stat. § 83.49(3)(a)</span></div>
  <div class="al-toast" role="status"><span class="al-spinner"></span><span class="al-toast__label">Checking lease · 8 of 14 clauses</span><button class="al-toast__action">Cancel</button></div>
  <div class="al-toast" role="status"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/> <path d="M14 2v5a1 1 0 0 0 1 1h5"/> <path d="m9 15 2 2 4-4"/></svg><span class="al-toast__label">Lease checked: 4 findings</span><button class="al-toast__action">View</button></div>
  <div class="al-row"><span class="al-tooltip" role="tooltip">Stop generating <span class="al-kbd">Esc</span></span><span class="al-tooltip" role="tooltip">Copy reference</span></div>
</div>
</body>
</html>
