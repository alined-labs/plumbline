<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>TraceWaterfall</title>
</head>
<body>
<div class="al-pad">
  <div class="al-trace" role="table" aria-label="Trace for the deposit answer">
    <div class="al-trace__row al-trace__row--axis" role="row"><span role="columnheader">Span</span><span class="al-trace__ticks" role="columnheader" aria-label="Timeline"><span style="--at:0%">0</span><span style="--at:23.8%">1 s</span><span style="--at:47.5%">2 s</span><span style="--at:71.3%">3 s</span><span style="--at:95%">4 s</span></span><span role="columnheader" style="text-align:right">Time</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:0"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h13"/> <path d="M13 12h8"/> <path d="M13 19h8"/> <path d="M3 10a2 2 0 0 0 2 2h3"/> <path d="M3 5v12a2 2 0 0 0 2 2h3"/></svg><strong>answer</strong></span><span role="cell" class="al-trace__track"><span class="al-trace__bar" style="--start:0%;--width:100%"></span></span><span role="cell" class="al-trace__dur">4,210 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:1">read question <span class="al-badge al-badge--code" style="height:18px">replay</span></span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--cache" style="--start:0%;--width:4%"></span></span><span role="cell" class="al-trace__dur">180 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:1">retrieve</span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--retrieve" style="--start:4%;--width:22%"></span></span><span role="cell" class="al-trace__dur">940 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:2">keyword (bm25)</span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--retrieve" style="--start:4%;--width:5%"></span></span><span role="cell" class="al-trace__dur">210 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:2">vector</span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--retrieve" style="--start:4%;--width:9%"></span></span><span role="cell" class="al-trace__dur">360 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:2">rerank</span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--retrieve" style="--start:13%;--width:13%"></span></span><span role="cell" class="al-trace__dur">550 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:1">generate</span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--model" style="--start:26%;--width:43%"></span></span><span role="cell" class="al-trace__dur">1,820 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:1">verify citations</span><span role="cell" class="al-trace__track"><span class="al-trace__bar al-trace__bar--verify" style="--start:69%;--width:15%"></span></span><span role="cell" class="al-trace__dur">610 ms</span></div>
    <div class="al-trace__row al-trace__row--failed" role="row"><span role="cell" class="al-trace__name" style="--depth:2;color:var(--danger)"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m15 9-6 6"/> <path d="m9 9 6 6"/></svg>citation 3 not found</span><span role="cell" class="al-trace__track"><span class="al-trace__bar" style="--start:76%;--width:6%"></span></span><span role="cell" class="al-trace__dur">240 ms</span></div>
    <div class="al-trace__row" role="row"><span role="cell" class="al-trace__name" style="--depth:1">stream</span><span role="cell" class="al-trace__track"><span class="al-trace__bar" style="--start:84%;--width:16%"></span></span><span role="cell" class="al-trace__dur">660 ms</span></div>
  </div>
</div>
</body>
</html>
