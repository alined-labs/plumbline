<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>Composer</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:720px">
  <form class="al-composer" onsubmit="return false">
    <label class="al-sr" for="q">Your question</label>
    <textarea id="q" rows="2" placeholder="Ask about a lease in Dubai, Spain, Colombia or Florida"></textarea>
    <div class="al-composer__bar">
      <button class="al-chip" type="button" aria-haspopup="menu">Florida <span class="al-badge al-badge--code">US-FL</span><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="al-btn al-btn--ghost al-btn--icon al-btn--sm" type="button" aria-label="Attach a lease"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg></button>
      <button class="al-btn al-btn--primary al-btn--icon al-composer__send" type="submit" aria-label="Send question"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/> <path d="M12 19V5"/></svg></button>
    </div>
  </form>
  <form class="al-composer" onsubmit="return false">
    <label class="al-sr" for="q2">Your question</label>
    <textarea id="q2" rows="1">How long does my landlord have to return my deposit?</textarea>
    <div class="al-composer__bar">
      <button class="al-chip" type="button" aria-haspopup="menu">All four <svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="al-btn al-btn--secondary al-btn--sm al-composer__send" type="button"><svg class="al-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>Stop <span class="al-kbd">Esc</span></button>
    </div>
  </form>
  <p class="al-disclaimer">Legal information, not legal advice.</p>
</div>
</body>
</html>
