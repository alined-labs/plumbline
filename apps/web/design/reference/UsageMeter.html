<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="components.css">
<title>UsageMeter</title>
</head>
<body>
<div class="al-pad al-stack" style="max-width:320px;gap:20px">
  <div class="al-meter"><div class="al-meter__row"><span>Demo questions</span><strong>12 of 20</strong></div><div class="al-meter__track" role="meter" aria-valuenow="12" aria-valuemin="0" aria-valuemax="20" aria-label="Demo questions used"><div class="al-meter__fill" style="width:60%"></div></div><span>Resets at 00:00 UTC</span></div>
  <div class="al-meter al-meter--low"><div class="al-meter__row"><span>Demo questions</span><strong>18 of 20</strong></div><div class="al-meter__track" role="meter" aria-valuenow="18" aria-valuemin="0" aria-valuemax="20" aria-label="Demo questions used"><div class="al-meter__fill" style="width:90%"></div></div><span style="color:var(--warning)">2 left today · resets at 00:00 UTC</span></div>
</div>
</body>
</html>
