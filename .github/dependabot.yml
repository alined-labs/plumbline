# Security alerts cover every ecosystem; version updates only for the pinned actions and
# the API image's pinned base images (the Python and JavaScript locks follow the 7-day
# release-age policy instead, and the images wait out the same 7 days where the registry
# reports a publication date).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /deploy/api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # The package requires Python >=3.12,<3.13 and the image never downloads one, so the
    # base image takes 3.12 patch releases and digest refreshes only.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
