# Deploys the front end to Cloudflare Pages (Lane P): the static export, built against the
# production API named in deploy/prod.env, with deploy/pages/_headers. Runs after CI passes
# on main, or by hand. The API itself is not deployed from here: it runs on MX3 behind the
# tunnel (docs/runbook.md).
#
# Needs, in the repository's "production" environment: the secret CLOUDFLARE_API_TOKEN (a
# token scoped to Cloudflare Pages: Edit, on this account only) and the variable
# CLOUDFLARE_ACCOUNT_ID. Until they exist the job says so and deploys nothing.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PAGES_PROJECT: plumbline
  WRANGLER: wrangler@4.149.0

jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ steps.hosts.outputs.web }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Read the public hostnames
        id: hosts
        run: |
          # shellcheck source=/dev/null
          source deploy/prod.env
          echo "web=$WEB_HOST" >> "$GITHUB_OUTPUT"
          echo "api=$API_HOST" >> "$GITHUB_OUTPUT"
          if [[ -n $CLOUDFLARE_API_TOKEN && -n $CLOUDFLARE_ACCOUNT_ID ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare credentials are not set in the production environment yet; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.hosts.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.hosts.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.hosts.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.hosts.outputs.ready == 'true'
        name: Build the static export
        env:
          NEXT_PUBLIC_API_BASE_URL: https://${{ steps.hosts.outputs.api }}
          NEXT_PUBLIC_SITE_URL: https://${{ steps.hosts.outputs.web }}
        run: pnpm --filter @plumbline/web build
      - if: steps.hosts.outputs.ready == 'true'
        name: Add the response headers
        run: |
          sed "s|__API_ORIGIN__|https://${{ steps.hosts.outputs.api }}|g" deploy/pages/_headers > apps/web/out/_headers
          ! grep -q __API_ORIGIN__ apps/web/out/_headers
      - if: steps.hosts.outputs.ready == 'true'
        name: Upload to Cloudflare Pages
        run: >-
          pnpm dlx "$WRANGLER" pages deploy apps/web/out
          --project-name "$PAGES_PROJECT" --branch main
          --commit-hash "${{ github.event.workflow_run.head_sha || github.sha }}" --commit-dirty=false
