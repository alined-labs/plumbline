# CI on every pull request and on main (Lane P owns it). The same make targets the hub
# runs, on a clean runner, in replay mode, with no secrets. The `ci` job is the one
# required check: it passes only when every other job did.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CACHE_MODE: replay
  PLUMBLINE_REQUIRE_DB: "1"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: paradedb/paradedb:v0.26.2-pg18
        env:
          POSTGRES_USER: plumbline
          POSTGRES_PASSWORD: plumbline
          POSTGRES_DB: plumbline
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U plumbline -d plumbline"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: make check-py
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-workspace --format requirements.txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plumbline/web exec playwright install --with-deps chromium
      - run: make check-web
      - name: Audit JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # The production image: it builds from the lock, migrates a fresh database, and serves
  # /api/health as uid 10001 on a read-only filesystem with every capability dropped.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: paradedb/paradedb:v0.26.2-pg18
        env:
          POSTGRES_USER: plumbline
          POSTGRES_PASSWORD: plumbline
          POSTGRES_DB: plumbline
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U plumbline -d plumbline"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://plumbline:plumbline@localhost:5433/plumbline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint - < deploy/api/Dockerfile
      - name: Build the API image
        run: |
          docker build -f deploy/api/Dockerfile -t plumbline-api:ci .
          docker image ls plumbline-api:ci --format 'image size: {{.Size}}'
      - name: Migrate a fresh database with the image
        run: >-
          docker run --rm --network host --read-only --cap-drop ALL
          --security-opt no-new-privileges -e DATABASE_URL
          plumbline-api:ci alembic -c apps/api/alembic.ini upgrade head
      - name: Serve until the image's own healthcheck passes
        run: |
          docker run -d --name api --network host --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e DATABASE_URL plumbline-api:ci
          for _ in $(seq 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy
          curl -fsS http://127.0.0.1:8000/api/health
          test "$(docker exec api id -u)" = 10001
      - if: failure()
        run: docker logs api || true

  ci:
    if: always()
    needs: [python, web, secrets, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.python.result }}" = success
          test "${{ needs.web.result }}" = success
          test "${{ needs.secrets.result }}" = success
          test "${{ needs.image.result }}" = success
